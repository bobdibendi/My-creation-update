<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Creation</title>
    <!--
      frame-src autorise uniquement l'aperçu local servi sur la boucle locale.
      img-src accepte data: pour afficher les captures d'écran renvoyées par le
      processus principal sans écrire de fichier temporaire accessible au web.
      connect-src ajoute https://*.supabase.co : l'authentification (Supabase
      Auth) et la vérification d'abonnement passent par ce domaine, clé
      publishable uniquement — aucun secret n'y transite.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:; frame-src http://127.0.0.1:* http://localhost:*; connect-src 'self' http://127.0.0.1:* http://localhost:* https://*.supabase.co;">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
